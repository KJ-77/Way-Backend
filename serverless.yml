# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: waybeirut
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: way-backend
# "service" is the name of this project. This will also be added to your AWS resource names.
service: Way-Backend

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external:
      - pg-native

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-3
  stage: ${opt:stage, 'dev'}
  profile: Tarek
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:SignUp
          Resource:
            - arn:aws:cognito-idp:eu-west-3:*:userpool/${env:COGNITO_USER_POOL_ID}
            - arn:aws:cognito-idp:eu-west-3:*:userpool/${env:CLIENT_COGNITO_USER_POOL_ID}
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:eu-west-3:*:function:${self:service}-${self:provider.stage}-accountDbOps
            - arn:aws:lambda:eu-west-3:*:function:${self:service}-${self:provider.stage}-userDbOps
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    CLIENT_COGNITO_USER_POOL_ID: ${env:CLIENT_COGNITO_USER_POOL_ID}
    CLIENT_COGNITO_CLIENT_ID: ${env:CLIENT_COGNITO_CLIENT_ID}
  httpApi:
    cors:
      allowedOrigins:
        - "https://www.waybeirut.com"
        - "https://waybeirut.com"
        - "https://admin.waybeirut.com"
        - "https://way-admin-gamma.vercel.app" #admin panel deployed on Vercel
        - "https://way-one.vercel.app" #client app deployed on Vercel
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
        - "http://localhost:3001"
        - "http://127.0.0.1:3001"
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-Api-Key
        - Accept
        - X-Filename
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 86400
    payload: "2.0"
    disableDefaultEndpoint: false
    authorizers:
      # Multi-pool Lambda authorizer — accepts tokens from BOTH admin and client Cognito pools.
      # Source: src/functions/authorizer/handler.ts. Pool config is driven by JWT_POOLS env var.
      # resultTtlInSeconds=0 disables caching while we're iterating in dev. For prod we
      # should bump this to 300 (5 min) — see local/Claude/claude.md.
      customJwtAuthorizer:
        type: request
        functionName: customJwtAuthorizer
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        resultTtlInSeconds: 0

functions:
  # ── Lambda Authorizer ──
  # Verifies JWTs from any pool listed in JWT_POOLS. Lives outside the VPC because
  # it needs internet access to fetch the Cognito JWKS endpoint on first use.
  # See plan: local/Claude/plans wasn't copied here yet — refer to Way-Client/local/Claude/plans/lambda-authorizer.md.
  customJwtAuthorizer:
    handler: src/functions/authorizer/handler.handler
    environment:
      JWT_POOLS: '[{"userPoolId":"${env:COGNITO_USER_POOL_ID}","clientId":"${env:COGNITO_CLIENT_ID}","label":"admin"},{"userPoolId":"${env:CLIENT_COGNITO_USER_POOL_ID}","clientId":"${env:CLIENT_COGNITO_CLIENT_ID}","label":"client"}]'

  # ── Auth (public, no auth required) ──
  # POST /auth/signup — self-service client signup. Cognito.SignUp (user picks
  # password, gets emailed a verification code) + DB insert keyed by sub.
  # Atomic rollback if the DB insert fails.
  signup:
    handler: src/functions/auth/handler.signup
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /auth/signup
          method: POST
          # no authorizer — public endpoint

  # ── Health (no auth) ──
  health:
    handler: src/functions/health/handler.health
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /
          method: GET

  # ── Dashboard ──
  getDashboard:
    handler: src/functions/dashboard/handler.getDashboard
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /dashboard
          method: GET
          authorizer:
            name: customJwtAuthorizer

  # ── Users ──
  # DB-only read operations stay inside VPC
  getUsers:
    handler: src/functions/users/handler.getUsers
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /users
          method: GET
          authorizer:
            name: customJwtAuthorizer
      - httpApi:
          path: /users/{id}
          method: GET
          authorizer:
            name: customJwtAuthorizer

  # Internal DB Lambda — invoked by Cognito-facing user handlers, no HTTP events
  userDbOps:
    handler: src/functions/users/db-handler.userDbOps
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680

  # Cognito-facing operations live OUTSIDE VPC (need internet for Cognito API)
  # They invoke userDbOps Lambda for DB writes
  createUser:
    handler: src/functions/users/handler.createUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users
          method: POST
          authorizer:
            name: customJwtAuthorizer

  updateUser:
    handler: src/functions/users/handler.updateUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}
          method: PUT
          authorizer:
            name: customJwtAuthorizer

  deleteUser:
    handler: src/functions/users/handler.deleteUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}
          method: DELETE
          authorizer:
            name: customJwtAuthorizer

  # Restores a soft-deleted user (flips is_active=true and re-enables their Cognito login)
  restoreUser:
    handler: src/functions/users/handler.restoreUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}/restore
          method: POST
          authorizer:
            name: customJwtAuthorizer

