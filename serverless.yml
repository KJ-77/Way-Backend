    events:
      - httpApi:
          path: /user-packages/{id}
          method: PUT
          authorizer:
            name: customJwtAuthorizer

  deleteUserPackage:
    handler: src/functions/user-packages/handler.deleteUserPackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
