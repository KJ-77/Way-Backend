# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: waybeirut
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: way-backend
# "service" is the name of this project. This will also be added to your AWS resource names.
service: Way-Backend

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    # Keep in step with provider.runtime below.
    target: node24
    platform: node
    external:
      - pg-native

provider:
  name: aws
  # Node 24 — supported by AWS until ~April 2028. (Node 20 lost security patches
  # on 2026-04-30; AWS blocks creating nodejs20.x functions from 2027-02-01 and
  # updating them from 2027-03-03.) Node 24 has NO callback-style handlers — every
  # handler here is async, and new ones must be too, or Lambda refuses to run them.
  runtime: nodejs24.x
  region: eu-west-3
  stage: ${opt:stage, 'dev'}
  profile: Tarek
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminUserGlobalSignOut
            - cognito-idp:SignUp
          Resource:
            - arn:aws:cognito-idp:eu-west-3:*:userpool/${env:COGNITO_USER_POOL_ID}
            - arn:aws:cognito-idp:eu-west-3:*:userpool/${env:CLIENT_COGNITO_USER_POOL_ID}
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:eu-west-3:*:function:${self:service}-${self:provider.stage}-accountDbOps
            - arn:aws:lambda:eu-west-3:*:function:${self:service}-${self:provider.stage}-userDbOps
        # ── AWS End User Messaging SMS ──
        # Lets the messaging Lambdas send SMS. `sms-voice` is the IAM namespace for
        # End User Messaging SMS (the service was formerly Amazon Pinpoint SMS).
        #
        # ⚠️ Resource is "*" for now. Narrow it to the sender ID ARN once the sender
        # ID is registered — it looks like:
        #   arn:aws:sms-voice:<region>:<account>:sender-id/<SenderId>/<ISO country>
        # Leaving it wide means any Lambda in this service can send SMS from any
        # origination identity in the account, which is more than the queue needs.
        - Effect: Allow
          Action:
            - sms-voice:SendTextMessage
            # Read-only, used to verify the sender ID exists at deploy/health time.
            - sms-voice:DescribeSenderIds
            - sms-voice:DescribeAccountAttributes
          Resource: "*"
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    CLIENT_COGNITO_USER_POOL_ID: ${env:CLIENT_COGNITO_USER_POOL_ID}
    CLIENT_COGNITO_CLIENT_ID: ${env:CLIENT_COGNITO_CLIENT_ID}
    # ── Messaging ──
    # DEFAULT_MESSAGE_CHANNEL picks how new messages are delivered.
    #   whatsapp_manual (default) — staff send each one by hand from the studio's own
    #                               WhatsApp via a wa.me link. Needs no provider at all,
    #                               so MESSAGING_PROVIDER is irrelevant for it.
    #   sms                       — AWS End User Messaging SMS. Built but dormant: AWS
    #                               declined production access until the account has
    #                               a paid billing history.
    #
    # MESSAGING_PROVIDER only matters for provider channels (sms). Unset or "mock" →
    # messages are logged, never sent. Set "aws-sms" ONLY once AWS grants production
    # access. Every default here is the safe one.
    MESSAGING_PROVIDER: ${env:MESSAGING_PROVIDER, 'mock'}
    DEFAULT_MESSAGE_CHANNEL: ${env:DEFAULT_MESSAGE_CHANNEL, 'whatsapp_manual'}
    # Alphanumeric sender ID (max 11 chars), e.g. "WayStudio". Required when
    # MESSAGING_PROVIDER=aws-sms — getProvider() throws a clear error without it.
    SMS_SENDER_ID: ${env:SMS_SENDER_ID, ''}
    # End User Messaging SMS is region-scoped; leave blank to use the stack region.
    SMS_REGION: ${env:SMS_REGION, ''}
    # Configuration set name that publishes delivery events to SNS. Without it the
    # smsStatus function below never fires and messages never progress past 'sent'.
    SMS_CONFIGURATION_SET: ${env:SMS_CONFIGURATION_SET, ''}
    # Per-message spend ceiling in USD (AWS MaxPrice format, e.g. "0.05"). A cheap
    # guard against a pricing surprise on multi-part Arabic messages.
    SMS_MAX_PRICE: ${env:SMS_MAX_PRICE, ''}
  httpApi:
    cors:
      allowedOrigins:
        - "https://www.waybeirut.com"
        - "https://waybeirut.com"
        - "https://admin.waybeirut.com"
        - "https://way-admin-gamma.vercel.app" #admin panel deployed on Vercel
        - "https://way-one.vercel.app" #client app deployed on Vercel
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
        - "http://localhost:3001"
        - "http://127.0.0.1:3001"
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-Api-Key
        - Accept
        - X-Filename
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 86400
    payload: "2.0"
    disableDefaultEndpoint: false
    authorizers:
      # Multi-pool Lambda authorizer — accepts tokens from BOTH admin and client Cognito pools.
      # Source: src/functions/authorizer/handler.ts. Pool config is driven by JWT_POOLS env var.
      # resultTtlInSeconds=0 disables caching while we're iterating in dev. For prod we
      # should bump this to 300 (5 min) — see local/Claude/claude.md.
      customJwtAuthorizer:
        type: request
        functionName: customJwtAuthorizer
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        resultTtlInSeconds: 300

functions:
  # ── Lambda Authorizer ──
  # Verifies JWTs from any pool listed in JWT_POOLS. Lives outside the VPC because
  # it needs internet access to fetch the Cognito JWKS endpoint on first use.
  # See plan: local/Claude/plans wasn't copied here yet — refer to Way-Client/local/Claude/plans/lambda-authorizer.md.
  customJwtAuthorizer:
    handler: src/functions/authorizer/handler.handler
    environment:
      JWT_POOLS: '[{"userPoolId":"${env:COGNITO_USER_POOL_ID}","clientId":"${env:COGNITO_CLIENT_ID}","label":"admin"},{"userPoolId":"${env:CLIENT_COGNITO_USER_POOL_ID}","clientId":"${env:CLIENT_COGNITO_CLIENT_ID}","label":"client"}]'

  # ── Auth (public, no auth required) ──
  # POST /auth/signup — self-service client signup. Cognito.SignUp (user picks
  # password, gets emailed a verification code) + DB insert keyed by sub.
  # Atomic rollback if the DB insert fails.
  signup:
    handler: src/functions/auth/handler.signup
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /auth/signup
          method: POST
          # no authorizer — public endpoint

  # ── Health (no auth) ──
  health:
    handler: src/functions/health/handler.health
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /
          method: GET

  # ── Users ──
  # DB-only read operations stay inside VPC
  getUsers:
    handler: src/functions/users/handler.getUsers
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /users
          method: GET
          authorizer:
            name: customJwtAuthorizer
      - httpApi:
          path: /users/{id}
          method: GET
          authorizer:
            name: customJwtAuthorizer

  # Internal DB Lambda — invoked by Cognito-facing user handlers, no HTTP events
  userDbOps:
    handler: src/functions/users/db-handler.userDbOps
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680

  # Cognito-facing operations live OUTSIDE VPC (need internet for Cognito API)
  # They invoke userDbOps Lambda for DB writes
  createUser:
    handler: src/functions/users/handler.createUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users
          method: POST
          authorizer:
            name: customJwtAuthorizer

  updateUser:
    handler: src/functions/users/handler.updateUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}
          method: PUT
          authorizer:
            name: customJwtAuthorizer

  deleteUser:
    handler: src/functions/users/handler.deleteUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}
          method: DELETE
          authorizer:
            name: customJwtAuthorizer

  # Restores a soft-deleted user (flips is_active=true and re-enables their Cognito login)
  restoreUser:
    handler: src/functions/users/handler.restoreUser
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}/restore
          method: POST
          authorizer:
            name: customJwtAuthorizer

  # Admin/studio-manager triggered password reset for a client — generates a temp password
  # in the client Cognito pool and returns it so the admin can share it with the client.
  resetUserPassword:
    handler: src/functions/users/handler.resetUserPassword
    environment:
      USER_DB_FUNCTION: ${self:service}-${self:provider.stage}-userDbOps
    events:
      - httpApi:
          path: /users/{id}/reset-password
          method: POST
          authorizer:
            name: customJwtAuthorizer

  # ── Sessions ──
  getSessions:
    handler: src/functions/sessions/handler.getSessions
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /sessions
          method: GET
          authorizer:
            name: customJwtAuthorizer

  getSession:
    handler: src/functions/sessions/handler.getSession
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /sessions/{id}
          method: GET
          authorizer:
            name: customJwtAuthorizer

  createSession:
    handler: src/functions/sessions/handler.createSession
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /sessions
          method: POST
          authorizer:
            name: customJwtAuthorizer

  updateSession:
    handler: src/functions/sessions/handler.updateSession
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /sessions/{id}
          method: PUT
          authorizer:
            name: customJwtAuthorizer

  deleteSession:
    handler: src/functions/sessions/handler.deleteSession
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /sessions/{id}
          method: DELETE
          authorizer:
            name: customJwtAuthorizer

  # ── Packages ──
  # All endpoints require a logged-in user (any role). The catalog is gated
  # per the client's request — anonymous browsing is not offered.
  # Mutations additionally require admin / studio-manager via requireRole().
  getPackages:
    handler: src/functions/packages/handler.getPackages
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /packages
          method: GET
          authorizer:
            name: customJwtAuthorizer

  getPackage:
    handler: src/functions/packages/handler.getPackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /packages/{id}
          method: GET
          authorizer:
            name: customJwtAuthorizer

  createPackage:
    handler: src/functions/packages/handler.createPackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /packages
          method: POST
          authorizer:
            name: customJwtAuthorizer

  updatePackage:
    handler: src/functions/packages/handler.updatePackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /packages/{id}
          method: PUT
          authorizer:
            name: customJwtAuthorizer

  deletePackage:
    handler: src/functions/packages/handler.deletePackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /packages/{id}
          method: DELETE
          authorizer:
