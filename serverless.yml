          path: /schedule/{id}
          method: DELETE
          authorizer:
            name: customJwtAuthorizer

  # Schedule overrides — per-week exceptions (fully-booked / cancelled).
  # Upsert + clear share /schedule/{id}/override; week is in the body (PUT)
  # or query string (DELETE).
  upsertScheduleOverride:
    handler: src/functions/schedule/handler.upsertScheduleOverride
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
