  # ── User Packages (Subscriptions) ──
  getUserPackages:
    handler: src/functions/user-packages/handler.getUserPackages
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /user-packages
          method: GET
          authorizer:
            name: customJwtAuthorizer

  getUserPackage:
    handler: src/functions/user-packages/handler.getUserPackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /user-packages/{id}
          method: GET
          authorizer:
            name: customJwtAuthorizer

  createUserPackage:
    handler: src/functions/user-packages/handler.createUserPackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /user-packages
          method: POST
          authorizer:
            name: customJwtAuthorizer

  updateUserPackage:
    handler: src/functions/user-packages/handler.updateUserPackage
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
