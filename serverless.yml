  # ── Messaging: SMS delivery receipts ──
  # Consumes carrier events (delivered / failed / etc.) that AWS End User Messaging
  # SMS publishes to SNS, and ratchets messages.status forward accordingly.
  # Inside the VPC because it writes to RDS.
  #
  # ⚠️ SNS SUBSCRIPTION DELIBERATELY COMMENTED OUT — SMS IS DORMANT.
  #
  # AWS declined SMS production access (new account, no billing history yet), so
  # the studio sends by hand via WhatsApp for now and nothing publishes to this
  # topic. The subscription references ${env:SMS_EVENT_TOPIC_ARN} with no fallback,
  # and that variable isn't in .env — left active, it fails the ENTIRE
  # `serverless deploy`, blocking every unrelated feature.
  #
  # To reactivate when SMS comes back:
  #   1. Add to .env:
  #        SMS_EVENT_TOPIC_ARN=arn:aws:sns:eu-west-3:779257801284:way-sms-topic
  #   2. Uncomment the `events:` block below.
  #   3. serverless deploy
  #
  # The topic, the `way-sms` configuration set and the event destination all still
  # exist in AWS, so nothing needs recreating. `topicName` must match the last
  # segment of the ARN — Serverless names the subscription resource from it.
  smsStatus:
    handler: src/functions/messaging/status-handler.smsStatusHandler
    vpc:
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    # events:
    #   - sns:
    #       arn: ${env:SMS_EVENT_TOPIC_ARN}
    #       topicName: way-sms-topic

  # ── Communications: approval queue ──
  # Staff-only (admin + studio-manager); the handler enforces this per-request since
  # client Cognito tokens also reach this API.
  #
  # The `&messagingVpc` anchor below is defined once and aliased (`*messagingVpc`) by
  # every messaging function — same VPC config as everything else that touches RDS,
  # without sixteen copies of it.
  getMessageQueue:
    handler: src/functions/messaging/handler.getQueue
    vpc: &messagingVpc
      securityGroupIds:
        - sg-07ae81e354436980c
      subnetIds:
        - subnet-0d78211d7c5202876
        - subnet-01084e20e83286143
        - subnet-01554d440f1605680
    events:
      - httpApi:
          path: /messages/queue
          method: GET
          authorizer:
            name: customJwtAuthorizer

  # The "needs attention" pile — sends we handed to the provider but never got a
  # confirmed result for. Never auto-retried; a human resolves each one.
  getUnconfirmedMessages:
    handler: src/functions/messaging/handler.getUnconfirmed
    vpc: *messagingVpc
    events:
      - httpApi:
          path: /messages/unconfirmed
          method: GET
          authorizer:
            name: customJwtAuthorizer

  createMessage:
    handler: src/functions/messaging/handler.createMessage
    vpc: *messagingVpc
    events:
      - httpApi:
          path: /messages
          method: POST
          authorizer:
            name: customJwtAuthorizer

  # Approve + send. Sends SYNCHRONOUSLY, so this is the one messaging endpoint that
  # can approach API Gateway's 29s ceiling; the service bounds provider calls at 8s
  # with at most 2 retries to stay well inside it.
  approveMessage:
